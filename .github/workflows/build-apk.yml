name: Build Android APK

on:
  push:
    tags: [ 'v*' ]
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev ccache

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "buildozer==1.5.0" "cython<3"

      - name: Accept Android SDK licenses
        run: |
          LIC="$HOME/.buildozer/android/platform/android-sdk/licenses"
          mkdir -p "$LIC"
          printf '\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$LIC/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' > "$LIC/android-sdk-preview-license"
          printf '\n601085b94cd77f0b54ff86406957099ebe79c4d6\n' > "$LIC/android-googletv-license"
          printf '\n33b6a2b64607f17b320f9f8cb60b6254b2d0d1ef\n' > "$LIC/android-gdk-license"

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParkourRunner-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Create/Update Release with APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk
          generate_release_notes: true
