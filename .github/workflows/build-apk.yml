name: Build Android APK

on:
  push:
    tags: [ 'v*' ]
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev ccache

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install "buildozer==1.5.0" "cython<3"

      - name: Fix sdkmanager path
        run: |
          SDK=/usr/local/lib/android/sdk
          if [ ! -f "$SDK/tools/bin/sdkmanager" ]; then
            SM=$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -1)
            echo "Found sdkmanager: $SM"
            sudo mkdir -p "$SDK/tools/bin"
            sudo ln -sf "$SM" "$SDK/tools/bin/sdkmanager"
          fi
          ls -l "$SDK/tools/bin/sdkmanager"
          yes | "$SDK/tools/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParkourRunner-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Create/Update Release with APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk
          generate_release_notes: true
